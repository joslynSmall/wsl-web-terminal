<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#111113">
  <meta name="format-detection" content="telephone=no">
  <title>WSL Web Terminal Hub</title>
  <link rel="stylesheet" href="/vendor/xterm/css/xterm.css">
  <link rel="stylesheet" href="/style.css?v=14">
</head>
<body>
  <div id="app-root" class="app-layout">
    <header class="top-nav">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <rect x="1.5" y="2.5" width="13" height="11" rx="2.5" stroke="currentColor" stroke-width="1.35"/>
            <path d="M4.5 6.2L6.8 8.2L4.5 10.2" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M8.5 10.2H11.2" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="brand-title">WSL Terminal Hub</span>
        <span id="connection-badge" class="badge badge-disconnected">● 未连接</span>
      </div>

      <div class="actions">
        <div class="action-group desktop-only-group">
          <button type="button" id="btn-toggle-keys" class="btn btn-ghost" title="显示或隐藏底部虚拟按键">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <rect x="1.5" y="3.5" width="13" height="9" rx="1.8" stroke="currentColor" stroke-width="1.3"/>
              <path d="M4 6.5H5M7.5 6.5H8.5M11 6.5H12M5 9.5H11" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
            </svg>
            <span>按键</span>
          </button>
          <div class="btn-segmented" role="group" aria-label="终端字号">
            <button type="button" id="btn-font-dec" class="btn btn-ghost btn-seg" title="缩小终端字号">A-</button>
            <button type="button" id="btn-font-inc" class="btn btn-ghost btn-seg" title="放大终端字号">A+</button>
          </div>
          <button type="button" id="btn-fullscreen" class="btn btn-ghost" title="切换浏览器全屏模式 (F11)">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M2.5 5.5V2.5H5.5M10.5 2.5H13.5V5.5M13.5 10.5V13.5H10.5M5.5 13.5H2.5V10.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span class="btn-label">全屏模式</span>
          </button>
          <button type="button" id="btn-refresh" class="btn btn-ghost btn-icon-sm" title="刷新窗口列表" aria-label="刷新窗口列表">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M13.2 8A5.2 5.2 0 1 1 11.7 4.3" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/>
              <path d="M13.5 2.5V5.3H10.7" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>

        <button type="button" id="btn-new-window" class="btn btn-tonal" title="新建 Shell 窗口">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M8 3.2V12.8M3.2 8H12.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <span class="new-win-label">新建</span>
        </button>

        <button type="button" id="btn-mobile-menu" class="btn btn-ghost btn-icon mobile-only-btn" title="更多功能" aria-label="更多功能">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M2.5 4.5H13.5M2.5 8H13.5M2.5 11.5H13.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </header>

    <nav class="tabs-bar">
      <div id="tabs-list" class="tabs-list"></div>
    </nav>

    <div id="terminal-accessory-bar" class="accessory-bar">
      <div class="accessory-scroller">
        <button type="button" class="acc-btn acc-btn-keyboard" data-key="KEYBOARD" title="唤起/聚焦手机输入法" aria-label="唤起输入法">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <rect x="1.5" y="3.5" width="13" height="9" rx="1.8" stroke="currentColor" stroke-width="1.3"/>
            <path d="M4 6.5H5M7.5 6.5H8.5M11 6.5H12M5 9.5H11" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
        </button>
        <button type="button" class="acc-btn" data-key="ESC" title="Escape">ESC</button>
        <button type="button" class="acc-btn" data-key="TAB" title="Tab 补全">TAB</button>
        <button type="button" class="acc-btn" data-key="CTRL" id="acc-btn-ctrl" title="Ctrl 组合键 (点击进入黏滞状态)">CTRL</button>
        <button type="button" class="acc-btn acc-btn-enter" data-key="ENTER" title="回车执行 (Enter)">ENTER ↵</button>
        <button type="button" class="acc-btn" data-key="CTRL_C" title="中断进程 (Ctrl+C)">^C</button>
        <button type="button" class="acc-btn acc-btn-arrow" data-key="UP" title="方向键 上">↑</button>
        <button type="button" class="acc-btn acc-btn-arrow" data-key="DOWN" title="方向键 下">↓</button>
        <button type="button" class="acc-btn acc-btn-arrow" data-key="LEFT" title="方向键 左">←</button>
        <button type="button" class="acc-btn acc-btn-arrow" data-key="RIGHT" title="方向键 右">→</button>
        <button type="button" class="acc-btn" data-key="PIPE" title="管道符 |">|</button>
        <button type="button" class="acc-btn" data-key="SLASH" title="路径斜杠 /">/</button>
        <button type="button" class="acc-btn" data-key="DASH" title="破折号 -">-</button>
        <button type="button" class="acc-btn" data-key="TILDE" title="主目录 ~">~</button>
      </div>
      <div class="acc-toggle-wrap">
        <button type="button" id="btn-toggle-accessory" class="acc-toggle-btn" title="折叠或展开按键栏"><span id="acc-toggle-icon">▲</span> <span id="acc-toggle-text">折叠</span></button>
      </div>
    </div>

    <main id="terminal-wrapper" class="terminal-wrapper">
      <div id="terminal-container" class="terminal-container"></div>
      <div id="empty-state" class="empty-state">正在连接服务…</div>
    </main>

    <footer class="status-bar">
      <span id="status-target" class="status-target">会话: -</span>
      <div class="status-meta">
        <span id="status-window" class="status-pill">Tabby 窗口: -</span>
        <span class="sep" aria-hidden="true">/</span>
        <span id="status-dim" class="status-pill status-dim">尺寸: -</span>
      </div>
    </footer>
  </div>

  <div id="mobile-menu-drawer" class="mobile-drawer hidden" role="dialog" aria-modal="true" aria-label="快捷操作">
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="mobile-drawer-header">
      <span class="mobile-drawer-title">终端控制</span>
      <button type="button" id="btn-close-drawer" class="btn-close" aria-label="关闭">&times;</button>
    </div>
    <div class="mobile-drawer-body">
      <div class="drawer-section">
        <div class="drawer-section-title">字号调节</div>
        <div class="drawer-btn-grid">
          <button type="button" id="btn-drawer-font-dec" class="btn btn-sheet">
            <span class="sheet-key">A-</span>
            <span>缩小字号</span>
          </button>
          <button type="button" id="btn-drawer-font-inc" class="btn btn-sheet">
            <span class="sheet-key">A+</span>
            <span>放大字号</span>
          </button>
        </div>
      </div>
      <div class="drawer-section">
        <div class="drawer-section-title">视图与会话</div>
        <div class="drawer-btn-list">
          <button type="button" id="btn-drawer-toggle-keys" class="btn btn-sheet">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <rect x="1.5" y="3.5" width="13" height="9" rx="1.8" stroke="currentColor" stroke-width="1.3"/>
              <path d="M4 6.5H5M7.5 6.5H8.5M11 6.5H12M5 9.5H11" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
            </svg>
            <span>显示 / 隐藏虚拟按键栏</span>
          </button>
          <button type="button" id="btn-drawer-fullscreen" class="btn btn-sheet">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M2.5 5.5V2.5H5.5M10.5 2.5H13.5V5.5M13.5 10.5V13.5H10.5M5.5 13.5H2.5V10.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>切换全屏模式</span>
          </button>
          <button type="button" id="btn-drawer-refresh" class="btn btn-sheet">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M13.2 8A5.2 5.2 0 1 1 11.7 4.3" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/>
              <path d="M13.5 2.5V5.3H10.7" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>刷新会话列表</span>
          </button>
        </div>
      </div>
    </div>
  </div>
  <div id="mobile-menu-backdrop" class="drawer-backdrop hidden"></div>

  <div id="new-terminal-panel" class="new-term-panel hidden" role="dialog" aria-modal="true" aria-label="新建终端">
    <div class="new-term-card">
      <div class="new-term-header">
        <span class="new-term-title">新建终端</span>
        <button type="button" id="new-term-close" class="btn-close" aria-label="关闭">&times;</button>
      </div>

      <div class="new-term-body">
        <section class="new-term-section">
          <div class="new-term-section-title">环境</div>
          <div id="new-term-env-list" class="env-list"></div>
        </section>

        <section class="new-term-section">
          <div class="new-term-section-title">工作目录</div>
          <div class="cwd-row">
            <span id="new-term-cwd-value" class="cwd-value">默认目录</span>
            <button type="button" id="new-term-browse" class="btn btn-sheet btn-sheet-sm">更改</button>
          </div>
          <input id="new-term-cwd-input" type="text" class="cwd-input" placeholder="或直接输入路径" spellcheck="false" autocomplete="off">

          <div id="new-term-recent" class="recent-wrap hidden">
            <div class="recent-title">最近使用</div>
            <div id="new-term-recent-list" class="recent-list"></div>
          </div>
        </section>

        <section id="new-term-browser" class="new-term-section hidden">
          <div class="browse-header">
            <button type="button" id="new-term-browse-back" class="browse-back" aria-label="上一级">‹</button>
            <span id="new-term-breadcrumb" class="browse-crumb"></span>
          </div>
          <div id="new-term-browse-error" class="browse-error hidden"></div>
          <div id="new-term-browse-list" class="browse-list"></div>
        </section>
      </div>

      <div id="new-term-browser-actions" class="new-term-browser-actions hidden">
        <button type="button" id="new-term-browse-use" class="btn btn-sheet btn-browse-use">用这个目录</button>
      </div>

      <div class="new-term-footer">
        <button type="button" id="new-term-cancel" class="btn btn-sheet">取消</button>
        <button type="button" id="new-term-create" class="btn btn-tonal">新建</button>
      </div>
    </div>
  </div>

  <script src="/vendor/xterm/lib/xterm.js"></script>
  <script src="/vendor/addon-web-links/lib/addon-web-links.js"></script>
  <script src="/app.js?v=15"></script>
</body>
</html>
